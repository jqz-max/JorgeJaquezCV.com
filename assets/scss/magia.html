<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcana - Tienda de Magia</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0f0b18;color:white}
header{padding:60px;text-align:center;background:linear-gradient(135deg,#2a1747,#0f0b18)}
h1{font-size:56px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:30px}
.card{background:#1b1428;padding:20px;border-radius:12px}
.price{color:#d6ad62;font-weight:bold}
button{background:#8b5cf6;color:white;border:none;padding:10px 15px;border-radius:8px;cursor:pointer}
#cart{position:fixed;top:10px;right:10px;background:#1b1428;padding:15px;border-radius:10px}
</style>
</head>
<body>
<header>
<h1>ARCANA</h1>
<p>Tienda de artículos de magia e ilusionismo</p>
</header>

<div id="cart">Carrito: <span id="count">0</span></div>

<div class="grid" id="products"></div>

<script>
const products=[
{name:"Baraja Arcana",price:499},
{name:"Kit de Magia Clásica",price:899},
{name:"Moneda del Ilusionista",price:289},
{name:"Libro de Ilusionismo",price:649},
{name:"Anillo Arcano",price:259},
{name:"Caja del Mago",price:1299}
];
let cart=0;
const grid=document.getElementById("products");
products.forEach(p=>{
 const div=document.createElement("div");
 div.className="card";
 div.innerHTML=`<h3>${p.name}</h3><p class='price'>$${p.price} MXN</p><button>Agregar</button>`;
 div.querySelector("button").onclick=()=>{
   cart++;
   document.getElementById("count").textContent=cart;
 };
 grid.appendChild(div);
});
</script>
</body>
</html>
